[package]
name = "slashbuilder-errand-kit"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "Gated, sandboxed agent runs: credentials are dropped, the verdict is computed in code, and the hand-back waits for consent."
license = "Apache-2.0"
repository = "https://github.com/slash-builder/errand-kit"
readme = "README.md"
keywords = ["agents", "sandbox", "gates", "automation"]
categories = ["development-tools"]
# Published crate name follows the studio convention `slashbuilder-<kit>`; the library keeps the short name `errand_kit` and the
# repository keeps the plain Kit name. A release is a deliberate act (Jenkinsfile.release), never a side effect of merging.
# Only the registries named here can be published to: crates.io and the studio's internal Nexus (`lockamy-hosted`).
publish = ["crates-io", "lockamy-hosted"]
# An allow-list, not an exclude: a Jenkinsfile, CI scripts, internal docs or this repo's hidden files can never ship by accident.
include = ["src/", "README.md", "LICENSE", "CHANGELOG.md", "spec/", "schema/", "fixtures/"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "errand_kit"
path = "src/lib.rs"

[[bin]]
name = "errand"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
globset = "0.4"
schemars = { version = "0.8", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }

[dev-dependencies]
tempfile = "3"
jsonschema = { version = "0.30", default-features = false }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "warn"

[features]
default = []
# `sandbox-none` exists only for tests; a release build has no way to run a worker without a verified boundary.
test-sandbox = []
